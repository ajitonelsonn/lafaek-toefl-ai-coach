<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="theme-color" content="#1769f5" />
    <link rel="icon" href="/vr/room/img/mascot.png" />
    <title>Study Room · LafaekTOEFL</title>
    <style>
      :root {
        --primary: #1769f5;
        --primary-hover: #2149b8;
        --ink: #101b4d;
        --body: #3c4a73;
        --line: #d7e2f7;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #eaf2ff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: var(--ink); }
      #scene-container { position: fixed; inset: 0; }
      /* Start screen: the /vr page already explains everything, so this is only the start step. */
      #overlay {
        position: fixed; inset: 0; display: grid; place-items: center; padding: 16px;
        background: radial-gradient(700px 520px at 50% 45%, rgba(245, 248, 255, 0.7), rgba(225, 234, 252, 0.88));
        backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
        opacity: 0; transition: opacity 0.3s;
      }
      #overlay.ready { opacity: 1; }
      #overlay[hidden], .group[hidden] { display: none; }
      .stack { display: flex; flex-direction: column; align-items: center; gap: 18px; }
      .group { display: flex; flex-direction: column; align-items: center; gap: 26px; text-align: center; }
      .start {
        position: relative; width: 200px; height: 200px; border: 0; border-radius: 50%; cursor: pointer;
        background: radial-gradient(circle at 35% 30%, #4b8dff, var(--primary) 60%, var(--primary-hover));
        color: #fff; font: inherit; font-size: 22px; font-weight: 800; letter-spacing: 0.01em;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
        box-shadow: 0 18px 40px rgba(23, 105, 245, 0.35), inset 0 2px 0 rgba(255, 255, 255, 0.25);
        transition: transform 0.2s;
      }
      .start img { width: 72px; height: auto; filter: brightness(0) invert(1); }
      .start::before, .start::after {
        content: ""; position: absolute; inset: -14px; border-radius: 50%; border: 3px solid rgba(23, 105, 245, 0.35);
        animation: pulse 2.4s ease-out infinite;
      }
      .start::after { animation-delay: 1.2s; }
      .start:hover:not(:disabled) { transform: scale(1.04); }
      .start:disabled { cursor: not-allowed; filter: grayscale(0.6); opacity: 0.6; }
      .start:disabled::before, .start:disabled::after { display: none; }
      @keyframes pulse { from { transform: scale(0.92); opacity: 1; } to { transform: scale(1.25); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .start::before, .start::after { animation: none; opacity: 0.4; } }
      .links { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
      .pill {
        height: 44px; padding: 0 20px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.92);
        color: var(--ink); font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; text-decoration: none;
        display: inline-flex; align-items: center; justify-content: center;
      }
      .pill:hover { border-color: var(--primary); color: var(--primary); }
      .pill.primary { border: 0; background: var(--primary); color: #fff; }
      .pill.primary:hover { background: var(--primary-hover); color: #fff; }
      .line { margin: 0; font-size: 17px; font-weight: 700; color: var(--ink); }
      #note { margin: 0; max-width: 360px; font-size: 13px; color: var(--body); text-align: center; }
      #note:empty { display: none; }
    </style>
    <script type="module" crossorigin src="/vr/room/assets/index-BECoubSm.js"></script>
  </head>
  <body>
    <div id="scene-container"></div>
    <div id="overlay">
      <div class="stack">
        <!-- Signed in with a study plan. -->
        <div id="ready" class="group" hidden>
          <button id="enter-vr" class="start" type="button"><img src="/vr/room/img/icon-vr.png" alt="" />Start VR</button>
          <div class="links">
            <button id="preview" class="pill" type="button">Preview in browser</button>
            <a class="pill" href="/vr">Back</a>
          </div>
        </div>
        <!-- Not signed in (the room was opened directly). -->
        <div id="need-login" class="group" hidden>
          <p class="line">Sign in to use the study room.</p>
          <div class="links">
            <a class="pill primary" href="/login?next=/vr">Sign in</a>
            <a class="pill" href="/vr">Back</a>
          </div>
        </div>
        <!-- Signed in without a study plan. -->
        <div id="need-plan" class="group" hidden>
          <p class="line">Create your study plan first.</p>
          <div class="links">
            <a class="pill primary" href="/study-plan">Create my study plan</a>
            <a class="pill" href="/vr">Back</a>
          </div>
        </div>
        <p id="note"></p>
      </div>
    </div>
  </body>
</html>
